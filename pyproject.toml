[project]
name = "portfolio-generator"
version = "0.1.0"
description = "Static site generator for dlubac.com"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dacite>=1.9.2",
    "pillow>=12.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.5",
]

[tool.ruff]
indent-width = 4
line-length = 120

[tool.ruff.format]
indent-style = "tab"
